name: Bug report
description: Report bugs related to Faugus only
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm using the latest version of Faugus.
          required: true
        - label: This bug is about Faugus itself, not about a specific game, Proton or GPU drivers.
          required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      placeholder: e.g. Arch Linux, Fedora 43, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      placeholder: e.g. KDE Plasma 6 (Wayland), GNOME 49 (Wayland), Xfce (X11)
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Faugus package
      options:
        - Native
        - Flatpak
        - AppImage
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen? If possible, include the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal logs
      description: |
        Run Faugus in a terminal and check if any errors appear when the issue occurs:
        - Native: `faugus-launcher`
        - Flatpak: `flatpak run io.github.Faugus.faugus-launcher`
        - AppImage: run the AppImage file

        If any errors appear, paste them here.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (if applicable)
      description: Drag and drop screenshots here.
