name: Update translation template

on:
  push:
    branches: [main]
    paths:
      - "faugus/**.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-pot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Regenerate languages/faugus-launcher.pot
        run: |
          xgettext --language=Python --keyword=_ --from-code=UTF-8 \
            --package-name=faugus-launcher \
            --output=languages/faugus-launcher.pot \
            faugus/*.py

      - name: Commit if translatable strings changed
        run: |
          strings() {
            msgcat --no-location --sort-output "$1" | grep -v -e '^"POT-Creation-Date:' -e '^#,'
          }
          git show "HEAD:languages/faugus-launcher.pot" > /tmp/old.pot 2>/dev/null || : > /tmp/old.pot
          if [ -s /tmp/old.pot ] && diff <(strings /tmp/old.pot) <(strings languages/faugus-launcher.pot) > /dev/null; then
            echo "No translatable string changes, nothing to commit."
            exit 0
          fi

          stash_dir="$(mktemp -d)"
          cp languages/faugus-launcher.pot "$stash_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp "$stash_dir/faugus-launcher.pot" languages/faugus-launcher.pot

            git add languages/faugus-launcher.pot
            if git diff --cached --quiet; then
              echo "Upstream already has this update, nothing to push."
              exit 0
            fi

            git commit -m "Update translation template (faugus-launcher.pot)"

            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed (likely a concurrent update), retrying..."
            sleep $((attempt * 10))
          done

          echo "Failed to push translation template update after multiple attempts." >&2
          exit 1
